name: Daily VOD TikTok Notify

on:
  schedule:
    # UTC 15:00 = 日本時間 翌0:00 (毎日, 前倒し通知: 基準日=実行日の翌日)
    - cron: "0 15 * * *"
    # UTC(水) 15:00 = 日本時間(木) 0:00 (毎週木曜, 週末前倒し通知: 金〜日曜分。基準日=金曜)
    - cron: "0 15 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "送信モード"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - weekend
      day_offset:
        description: "基準日オフセット(空欄なら自動: daily=1, weekend=1)"
        required: false
        default: ""
      days_ahead:
        description: "対象日数を直接指定(動作確認用。空欄なら自動計算)"
        required: false
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine notify mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 15 * * 3" ]; then
            MODE=weekend
            OFFSET=1
          elif [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            MODE=daily
            OFFSET=1
          else
            MODE="${{ github.event.inputs.mode }}"
            if [ -z "$MODE" ]; then MODE=daily; fi
            if [ -n "${{ github.event.inputs.day_offset }}" ]; then
              OFFSET="${{ github.event.inputs.day_offset }}"
            else
              OFFSET=1
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "day_offset=$OFFSET" >> "$GITHUB_OUTPUT"

      - name: Run notify script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--mode ${{ steps.mode.outputs.mode }} --day-offset ${{ steps.mode.outputs.day_offset }}"
          if [ -n "${{ github.event.inputs.days_ahead }}" ]; then
            ARGS="$ARGS --days-ahead ${{ github.event.inputs.days_ahead }}"
          fi
          python main.py $ARGS
